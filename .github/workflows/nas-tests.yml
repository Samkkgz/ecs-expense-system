name: NAS regression tests

on:
  push:
    paths:
      - 'nas/**'
      - '.github/workflows/nas-tests.yml'
  pull_request:
    paths:
      - 'nas/**'
      - '.github/workflows/nas-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test nas/tests/*.test.js
